name: StudyDesk Android checks & APK

on:
  workflow_dispatch:
    inputs:
      attach_smoke_apk:
        description: Attach a public side-by-side Android test APK from this branch (non-main only)
        type: boolean
        default: false
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package*.json'
      - '.github/workflows/flutter-check.yml'

permissions:
  contents: read

jobs:
  mobile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORG_GRADLE_PROJECT_studydeskSmoke: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.attach_smoke_apk }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check the PWA and bundled assets
        run: |
          npm ci
          npm run flutter:check
          npm test
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter source
        id: analyze
        working-directory: mobile
        run: bash ../scripts/report-ci-failure.sh flutter analyze --no-pub
      - name: Run Flutter unit and widget tests
        if: success() || steps.analyze.conclusion == 'failure'
        working-directory: mobile
        run: bash ../scripts/report-ci-failure.sh flutter test --no-pub --reporter expanded
      - name: Optionally reuse the personal test signing key
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          TEST_KEYSTORE: ${{ secrets.STUDYDESK_TEST_DEBUG_KEYSTORE_B64 }}
        run: |
          if [[ -z "$TEST_KEYSTORE" ]]; then
            echo '::warning::No stable test key configured. This APK is for a fresh test install, not updating a previous CI APK.'
            exit 0
          fi
          umask 077
          mkdir -p "$HOME/.android"
          key=$(mktemp "$HOME/.android/studydesk.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s' "$TEST_KEYSTORE" | base64 --decode > "$key"
          keytool -list -keystore "$key" -storepass android -alias androiddebugkey >/dev/null
          mv "$key" "$HOME/.android/debug.keystore"
      - name: Validate the Android debug build
        working-directory: mobile
        run: bash ../scripts/report-ci-failure.sh flutter build apk --debug --no-pub
      - name: Test Android payloads and private document storage
        working-directory: mobile/android
        run: bash ../../scripts/report-ci-failure.sh ./gradlew :app:testDebugUnitTest
      - name: Verify APK ID, signature, alignment, and audio resources
        run: |
          apk=mobile/build/app/outputs/flutter-apk/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          package=tz.altraware.studydesk
          if [[ "$ORG_GRADLE_PROJECT_studydeskSmoke" == true ]]; then
            package+=.smoke
          fi
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/studydesk-badging.txt"
          if ! grep -F "package: name='$package' " "$RUNNER_TEMP/studydesk-badging.txt"; then
            echo '::error::Unexpected StudyDesk APK package ID.'
            exit 1
          fi
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          python3 scripts/check-android-elf.py "$apk"
          bash scripts/report-ci-failure.sh python3 scripts/check-apk-welcome.py "$apk"
      - name: Prepare the test APK and checksum
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.attach_smoke_apk)
        run: |
          filename=StudyDesk-debug.apk
          if [[ "$ORG_GRADLE_PROJECT_studydeskSmoke" == true ]]; then
            filename=StudyDesk-test.apk
          fi
          mkdir -p "$RUNNER_TEMP/studydesk-apk"
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/studydesk-apk/$filename"
          cd "$RUNNER_TEMP/studydesk-apk"
          sha256sum "$filename" > "$filename.sha256"
      - name: Attach debug APK to this workflow run
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.attach_smoke_apk)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ORG_GRADLE_PROJECT_studydeskSmoke == 'true' && 'studydesk-android-smoke' || 'studydesk-android-debug' }}
          path: ${{ runner.temp }}/studydesk-apk/
          if-no-files-found: error
          retention-days: 7
